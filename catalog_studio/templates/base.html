<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Catalog Studio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 2rem; background: #f5f6f8; }
        table.data-table th { position: sticky; top: 0; background: #212529; color: white; }
        .table-wrap { max-height: 70vh; overflow: auto; }
        td { white-space: nowrap; }
        .badge-missing { background: #dc3545; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4 rounded px-3">
    <a class="navbar-brand" href="/">&#128295; Catalog Studio</a>
    <span class="text-white-50 small">ingest &rarr; edit &rarr; export mdf/ldf for Advance Steel import</span>
</nav>
<div class="container-fluid">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
