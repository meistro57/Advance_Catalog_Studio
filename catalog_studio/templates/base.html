<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Catalog Studio{% endblock %}</title>
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("catalogStudioTheme"); } catch (error) {}
            if (saved !== "dark" && saved !== "light") {
                saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", saved);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4 rounded px-3">
    <a class="navbar-brand" href="/">&#128295; Catalog Studio</a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small d-none d-lg-inline">ingest &rarr; edit &rarr; export mdf/ldf for Advance Steel import</span>
        <a class="btn btn-outline-light btn-sm" href="{{ issues_url }}" target="_blank" rel="noopener"
           title="Report a problem or ask for a feature on GitHub">Issues</a>
        <button type="button" class="btn btn-outline-light btn-sm" id="themeToggle"
                aria-pressed="false" title="Switch to dark mode">
            <span class="theme-icon" aria-hidden="true">&#9789;</span>
            <span class="theme-label">Dark</span>
        </button>
    </div>
</nav>
<div class="container-fluid">
    <div id="flashHost">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    </div>
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
