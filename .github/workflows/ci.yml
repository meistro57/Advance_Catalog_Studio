name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile every module
        run: python -m compileall -q catalog_studio tests *.py
      - name: Verify version file and changelog alignment
        run: |
          python -c "
          import pathlib, re
          ver = pathlib.Path('VERSION').read_text().strip()
          assert re.match(r'^\d+\.\d+\.\d+$', ver), f'Invalid VERSION: {ver}'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          assert f'[{ver}]' in changelog, f'Version {ver} missing from CHANGELOG.md'
          "
      - name: Run the test suite (no SQL Server needed)
        run: python -m pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pyflakes
        run: python -m pip install --upgrade pip pyflakes
      - name: Pyflakes
        run: pyflakes catalog_studio tests *.py
